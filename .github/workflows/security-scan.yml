name: security-scan

on:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roundz-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roundz-backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Container and IaC scan placeholder
        run: echo "Wire Trivy, Grype, Checkov, or cloud-native scanners here."
