name: docker-build

on:
  pull_request:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - rider-service
          - trip-service
          - wallet-service
          - notification-service
          - location-service
          - admin-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -f roundz-backend/apps/${{ matrix.service }}/Dockerfile -t roundz/${{ matrix.service }}:${{ github.sha }} roundz-backend
